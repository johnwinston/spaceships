<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaceships</title>
<script>
  // Card, sticker and claim-booklet QR codes point at the site root with the
  // ship in the fragment (#v=1&a=p4-01, maybe &c=<code>). Hand deck ships to
  // their page, anything else to the player, keeping the whole fragment.
  (function () {
    var h = location.hash || "";
    if (/[#&]a=p\d+-\d+(&|$)/.test(h)) location.replace("ship.html" + h);
    else if (/[#&](a|p)=/.test(h)) location.replace("play.html" + h);
  })();
</script>
<style>
  :root {
    --bg: #000000;
    --panel: #0d0d0d;
    --ink: #ffffff;
    --gold: #ffffff;
    --dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Futura", "Century Gothic", system-ui, sans-serif;
    padding: 24px 16px 64px;
  }
  header { max-width: 960px; margin: 0 auto 8px; display: flex; justify-content: space-between; align-items: baseline; }
  header a.about {
    color: var(--dim); text-decoration: none; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; border: 1px solid #333; border-radius: 999px; padding: 6px 14px;
  }
  header a.about:hover { color: var(--ink); border-color: var(--ink); }
  h1 { font-size: 26px; letter-spacing: 2px; margin: 0; }
  h1 span { color: var(--gold); }
  header p { color: var(--dim); margin: 4px 0 0; }
  main { max-width: 960px; margin: 0 auto; }
  h2 {
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); border-bottom: 1px solid var(--panel);
    padding-bottom: 6px; margin: 34px 0 14px;
  }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  a.card {
    display: block; background: var(--panel); border-radius: 10px;
    padding: 12px; text-decoration: none; color: var(--ink);
    border: 1px solid transparent;
  }
  a.card:hover { border-color: var(--gold); }
  a.card img {
    width: 100%; aspect-ratio: 1 / 1.41; object-fit: cover; display: block;
    background: #1a1a1a; border-radius: 6px;
  }
  a.card .code {
    font-size: 10.5px; color: var(--dim); margin-top: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  a.card .meta { font-size: 11.5px; margin-top: 2px; }
  a.card .claim { font-size: 11px; margin-top: 6px; color: var(--ink); }
  a.card .claim.unclaimed { color: var(--dim); }
  a.card.is-claimed { border-color: #2a2a2a; }
  #status { color: var(--dim); max-width: 960px; margin: 24px auto; }
</style>
</head>
<body>
<header>
  <h1>space<span>ships</span></h1>
  <a class="about" href="about.html">About</a>
</header>
<main id="tiers"></main>
<p id="status">loading catalog…</p>
<script src="js/config.js"></script>
<script src="js/claims.js"></script>
<script src="js/collection.js"></script>
</body>
</html>
