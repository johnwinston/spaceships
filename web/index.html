<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automons — fly your spaceship</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a23;
    --ink: #e8e6df;
    --gold: #ffd75e;
    --dim: #8b94a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Futura", "Century Gothic", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header { text-align: center; padding: 1.2rem 1rem 0.4rem; }
  header h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
  header h1 span { color: var(--gold); }
  #shipname { font-size: 1.15rem; margin: 0.4rem 0 0; color: var(--gold); }
  #shiprule { font-family: monospace; color: var(--dim); font-size: 0.85rem; }
  #shipmeta { color: var(--dim); font-size: 0.8rem; }
  main {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
    align-items: flex-start;
    padding: 1rem;
  }
  #board {
    background: var(--bg);
    border: 1px solid #26303d;
    border-radius: 6px;
    width: min(92vw, 640px);
    height: auto;
    image-rendering: pixelated;
    cursor: crosshair;
  }
  .panel {
    background: var(--panel);
    border: 1px solid #26303d;
    border-radius: 8px;
    padding: 1rem;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  button {
    background: #1d2836;
    color: var(--ink);
    border: 1px solid #33404f;
    border-radius: 6px;
    padding: 0.55rem 0.8rem;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--gold); }
  #mintbtn {
    background: var(--gold);
    color: #14100a;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  #mintbtn.disabled { opacity: 0.55; }
  label { font-size: 0.8rem; color: var(--dim); }
  input[type=range] { width: 100%; }
  .counters {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    color: var(--dim);
    font-size: 0.85rem;
  }
  .counters b { color: var(--ink); }
  #status {
    max-width: 640px;
    text-align: center;
    color: var(--dim);
    font-size: 0.85rem;
    padding: 0 1rem 1.5rem;
  }
  #status.error { color: #ff8a7a; }
</style>
</head>
<body>
  <header>
    <h1>auto<span>mons</span></h1>
    <p id="shipname">loading…</p>
    <p id="shiprule"></p>
    <p id="shipmeta"></p>
  </header>
  <main>
    <canvas id="board"></canvas>
    <div class="panel">
      <div class="counters">
        <span>gen <b id="generation">0</b></span>
        <span>pop <b id="population">0</b></span>
      </div>
      <button id="playpause">Pause</button>
      <button id="stepbtn">Step</button>
      <button id="resetbtn">Reset ship</button>
      <button id="clearbtn">Clear board</button>
      <label>speed
        <input id="speed" type="range" min="10" max="500" value="410">
      </label>
      <button id="mintbtn">Mint on Solana</button>
    </div>
  </main>
  <p id="status"></p>
  <script src="js/engine.js"></script>
  <script src="js/rle.js"></script>
  <script src="js/shipurl.js"></script>
  <script src="js/mint.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
