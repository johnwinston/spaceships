<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spaceship</title>
<style>
  /* Layout: one ship at a time. Big viewer (photo or live grid) left, ship sheet right; deck strip below. */
  :root {
    --bg: #000000;
    --panel: #0b0b0b;
    --line: #262626;
    --line-strong: #3a3a3a;
    --ink: #ffffff;
    --dim: #8a8a8a;
    --paper: #f2f1ee;
    --display: "Futura", "Jost", "Century Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--display);
    padding-inline: 16px;
    padding-block: 0 2.5rem;
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    gap: 0.5rem 1.5rem; padding-block: 1.4rem 0.6rem; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; }
  header p { margin: 0; color: var(--dim); font-size: 0.8rem; letter-spacing: 0.08em; }
  header h1 a.home { color: inherit; text-decoration: none; }
  .pn { display: flex; gap: 1.1rem; font: 0.78rem var(--mono); letter-spacing: 0.08em; }
  .pn a { color: var(--dim); text-decoration: none; }
  .pn a:hover { color: var(--ink); }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.25rem; align-items: start; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

  .viewer { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
  .frame {
    position: relative; width: min(100%, calc(76vh / 1.41)); max-width: 100%; aspect-ratio: 1 / 1.41; margin-inline: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .frame img, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frame img { object-fit: contain; background: var(--paper); }
  .frame canvas { touch-action: none; cursor: crosshair; }

  .modes { width: min(100%, calc(76vh / 1.41)); margin-inline: auto; display: flex; row-gap: 0.6rem; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; }
  .switch { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; }
  .switch button {
    background: transparent; color: var(--dim); border: 0; border-radius: 999px;
    padding: 0.5rem 1.1rem; font: 500 0.82rem var(--display); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
  }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .controls { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .controls[hidden] { display: none !important; }
  .btn {
    background: #141414; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px;
    padding: 0.45rem 0.75rem; font: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .btn:hover { border-color: var(--ink); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .btn.tog[aria-pressed="true"] { border-color: var(--ink); }
  .btn.tog[aria-pressed="false"] { color: var(--dim); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 0.4rem; }
  .sep { width: 1px; align-self: stretch; background: var(--line-strong); margin-inline: 0.15rem; }
  .gen { font: 0.75rem var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; min-width: 7ch; }
  .photos { display: flex; gap: 0.35rem; }
  .photos[hidden] { display: none !important; }

  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0;
  }
  .ed { font-size: 2.2rem; font-weight: 500; letter-spacing: 0.04em; line-height: 1; margin: 0; }
  .ed small { font-size: 0.9rem; color: var(--dim); letter-spacing: 0.1em; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 0.45rem 0.9rem; margin: 0; font-size: 0.8rem; }
  .meta dt { color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.68rem; padding-top: 0.15rem; }
  .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .meta dd.rule { font: 0.74rem/1.45 var(--mono); color: var(--ink); }
  .pill {
    display: inline-block; font: 500 0.66rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
    border: 1px solid var(--ink); border-radius: 999px; padding: 0.15rem 0.55rem;
  }
  .own { display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .own h2 { margin: 0; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .cta {
    display: block; text-align: center; text-decoration: none; border-radius: 6px; padding: 0.7rem;
    font-weight: 700; letter-spacing: 0.06em; font-size: 0.9rem;
  }
  .cta.primary { background: var(--ink); color: var(--bg); }
  .cta.secondary { border: 1px solid var(--line-strong); color: var(--ink); font-weight: 500; }
  .cta[aria-disabled="true"] { cursor: not-allowed; }
  .note { margin: 0; font-size: 0.74rem; color: var(--dim); line-height: 1.5; }
  .claim p { margin: 0; font-size: 0.85rem; color: var(--dim); }
  .claim p.error { color: var(--ink); text-decoration: underline; }
  .claim form { display: flex; flex-direction: column; gap: 0.6rem; }
  .claim label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.78rem; color: var(--dim); }
  .claim input[type=text] {
    width: 100%; background: #000000; color: var(--ink); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 0.5rem 0.6rem; font: inherit; letter-spacing: 0.08em;
  }
  .claim input[type=text]:focus { outline: none; border-color: var(--ink); }
  #claimcode, #claimwallet { font-family: var(--mono); }
  #claimcode { text-transform: uppercase; }
  #claimwallet { font-size: 0.75rem; letter-spacing: 0; }
  .wallethelp { font-size: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; }
  .wallethelp:empty { display: none; }
  .wallethelp button, #claimnft a { color: var(--ink); }
  .wallethelp button { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
  #claimnft { font-size: 0.85rem; }
  #claimbtn {
    background: var(--ink); color: var(--bg); border: 0; border-radius: 6px; padding: 0.7rem;
    font: 700 0.9rem var(--display); letter-spacing: 0.06em; cursor: pointer;
  }
  #claimbtn:disabled { opacity: 0.55; cursor: wait; }
  #claimhint { font-size: 0.75rem; }
  .note a { color: var(--ink); }

  .deck h2 { margin: 0 0 0.6rem; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .deckhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 1rem; margin-bottom: 0.6rem; }
  .deckhead h2 { margin: 0; }
  .filter { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; }
  .filter button { background: transparent; color: var(--dim); border: 0; border-radius: 999px; padding: 0.35rem 0.8rem; font: 500 0.72rem var(--display); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .period { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
  .period h3 { margin: 0; font: 500 0.7rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0.5rem; }
  .thumb .none { width: 100%; aspect-ratio: 1 / 1.41; border: 1px dashed var(--line-strong); border-radius: 3px; display: grid; place-items: center; color: var(--dim); font: 0.62rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; padding: 0.3rem; }
  .thumb.missing { color: var(--ink); }
  .nophoto { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 2rem; color: var(--dim); font-size: 0.9rem; line-height: 1.5; }
  .thumb {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem;
    cursor: pointer; color: var(--dim); font: 0.7rem var(--mono); display: flex; flex-direction: column; gap: 0.35rem; text-align: left;
  }
  .thumb img { width: 100%; aspect-ratio: 1 / 1.41; object-fit: cover; border-radius: 3px; display: block; }
  .thumb[aria-current="true"] { border-color: var(--ink); color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><a class="home" href="index.html">Spaceships</a></h1>
    <nav class="pn" aria-label="Ships">
      <a id="prev" href="#">Prev</a>
      <a href="index.html">All ships</a>
      <a id="next" href="#">Next</a>
    </nav>
  </header>

  <section class="stage">
    <div class="viewer">
      <div class="frame" id="frame">
        <img id="photo" alt="">
        <p class="nophoto" id="nophoto" hidden>No photo of this card yet.<br>Press Fly it to see the ship.</p>
        <canvas id="board" hidden aria-label="Live simulation of the ship. Drag to draw or erase cells."></canvas>
      </div>
      <div class="modes">
        <div class="switch" role="group" aria-label="View">
          <button id="m-art" aria-pressed="true">Artwork</button>
          <button id="m-live" aria-pressed="false">Fly it</button>
        </div>
        <div class="photos" id="photos"></div>
        <div class="controls" id="controls" hidden>
          <button class="btn primary" id="play">Play</button>
          <button class="btn" id="step">Step</button>
          <button class="btn" id="reset">Reset</button>
          <span class="gen" id="gen">gen 0</span>
        </div>
      </div>
    </div>

    <aside class="sheet">
      <p class="ed" id="ed">…</p>
      <dl class="meta">
        <dt>Ship</dt><dd id="sid"></dd>
        <dt>Rarity</dt><dd><span class="pill" id="rarity"></span></dd>
        <dt>Period</dt><dd id="period"></dd>
        <dt>Rule</dt><dd class="rule" id="rule"></dd>
      </dl>
      <section class="own claim" id="claim" hidden>
        <h2>Claim this ship</h2>
        <p id="claimstatus">…</p>
        <p id="claimnft" hidden></p>
        <form id="claimform" hidden autocomplete="off">
          <label>claim code
            <input id="claimcode" type="text" placeholder="XXXX-XXXX" maxlength="12"
                   spellcheck="false" autocapitalize="characters" required>
          </label>
          <label id="walletfield">your Solana wallet address, to receive the NFT
            <input id="claimwallet" type="text" maxlength="44" required
                   pattern="[1-9A-HJ-NP-Za-km-z]{32,44}" title="a Solana wallet address"
                   spellcheck="false" autocapitalize="off" autocomplete="off">
          </label>
          <p class="wallethelp" id="wallethelp">
            <button type="button" id="phantombtn" hidden>use my Phantom wallet</button>
          </p>
          <label>your name, shown on the collection
            <input id="claimname" type="text" placeholder="optional" maxlength="40">
          </label>
          <button type="submit" id="claimbtn">Claim</button>
          <p id="claimhint"></p>
        </form>
      </section>
    </aside>
  </section>

</div>

<script src="js/config.js"></script>
<script src="js/shipurl.js"></script>
<script src="js/claims.js"></script>
<script src="js/claim-ui.js"></script>

  if (Object.keys(pointers).length > 1) { painting = false; return; }
  var c = cellAtPt(pointers[e.pointerId]); if (!c) return;
  painting = true; paintVal = grid[c[1]*W+c[0]] ? 0 : 1; grid[c[1]*W+c[0]] = paintVal; draw();
});
canvas.addEventListener("pointermove", function (e) {
  if (!(e.pointerId in pointers)) return;
  pointers[e.pointerId] = canvasPt(e);
  if (painting) { var c = cellAtPt(pointers[e.pointerId]); if (c) { grid[c[1]*W+c[0]] = paintVal; draw(); } }
});
function release(e) {
  delete pointers[e.pointerId];
  if (!Object.keys(pointers).length) painting = false;
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
window.addEventListener("resize", function () {
  if (!running && gen === 0 && current) { loadShip(current); return; }   // untouched: re-fit the world to the new size
  if (mode === "live") { fitCard(); draw(); }
});

var ids = [];
// Same address scheme as the card-back QR codes: #v=1&a=<ship id> (src/shipurl.py).
function shipFromUrl() {
  var m = /[#&]a=([^&]+)/.exec(location.hash), q = m ? decodeURIComponent(m[1]) : "";
  return SHIPS[q] ? q : ids[0];
}
function shipHref(id) { return "ship.html#v=1&a=" + id; }
function setNav(id) {
  var i = ids.indexOf(id), p = ids[(i + ids.length - 1) % ids.length], n = ids[(i + 1) % ids.length];
  var a = document.getElementById("prev"), b = document.getElementById("next");
  a.href = shipHref(p); a.textContent = "\u2190 #" + SHIPS[p].edition;
  b.href = shipHref(n); b.textContent = "#" + SHIPS[n].edition + " \u2192";
  document.title = "Spaceship #" + SHIPS[id].edition + " \u00b7 " + id;
}
function openFromUrl() { var id = shipFromUrl(); setRunning(false); setMode("art"); setNav(id); loadShip(id); }
window.addEventListener("hashchange", openFromUrl);
fetch("catalog.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (catalog) {
  Object.keys(catalog).forEach(function (id) {
    var e = catalog[id];
    if (Number(e.edition) > 0) SHIPS[id] = { edition: Number(e.edition), period: e.period, rarity: e.rarity, rle: e.rle, rule: e.rule, table: e.table };
  });
  ids = Object.keys(SHIPS).sort(function (a, b) { return SHIPS[a].edition - SHIPS[b].edition; });
  DECK_SIZE = ids.length;
  openFromUrl();
}).catch(function (err) {
  document.getElementById("ed").textContent = "Couldn't load the ships. Try reloading.";
});
</script>
